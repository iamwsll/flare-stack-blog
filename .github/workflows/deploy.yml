name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'iamwsll/flare-stack-blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      DOMAIN: ${{ secrets.DOMAIN }}
      WORKER_NAME: my-blog
      QUEUE_NAME: blog-queue
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID || 'c01db543-ef72-4aa9-81eb-1c95fe3b080e' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun ci
      - name: Validate production configuration
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID BUCKET_NAME DOMAIN WORKER_NAME QUEUE_NAME; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required configuration: $key" >&2
              exit 1
            fi
          done
      - name: Build production assets
        run: bun run build
      - name: Validate deployment bundle
        run: bunx cf deploy --prebuilt --dry-run
      - name: Prepare runtime secrets
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(`${process.env.RUNNER_TEMP}/blog-runtime-secrets.json`,
              JSON.stringify({ UMAMI_WEBSITE_ID: process.env.VITE_UMAMI_WEBSITE_ID }),
              { mode: 0o600 });
          '
      - name: Apply database migrations
        run: bun run db:migrate
      - name: Deploy Worker and preserve runtime secrets
        run: bunx cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/blog-runtime-secrets.json" --message "$GITHUB_SHA"
